<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan EMI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 800px;">
  <h2 class="mb-4">Loan EMI Calculator</h2>

  <form id="emiForm" class="card card-body mb-4" novalidate>
    <div class="mb-3">
      <label class="form-label" for="principal">Loan amount</label>
      <input type="number" class="form-control" id="principal" min="1" step="any" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="rate">Annual interest rate (%)</label>
      <input type="number" class="form-control" id="rate" min="0.01" step="any" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="months">Tenure (months)</label>
      <input type="number" class="form-control" id="months" min="1" step="1" required>
    </div>
    <div id="errorBox" class="alert alert-danger d-none"></div>
    <button type="submit" class="btn btn-primary">Calculate</button>
  </form>

  <div id="resultPanel" class="card card-body mb-4 d-none">
    <h5>Result</h5>
    <p class="mb-1"><b>Monthly EMI:</b> <span id="emi"></span></p>
    <p class="mb-1"><b>Total payment:</b> <span id="total"></span></p>
    <p class="mb-1"><b>Total interest:</b> <span id="interest"></span></p>
    <p class="mb-0 text-muted"><small>Served by pod <span id="pod"></span> (<span id="podIp"></span>)</small></p>
  </div>

  <h5>Last 10 calculations</h5>
  <table class="table table-striped table-sm">
    <thead>
      <tr><th>Time</th><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served by</th></tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  function showError(msg) { $('#errorBox').text(msg).removeClass('d-none'); }

  function loadHistory() {
    $.getJSON('/api/history', function (rows) {
      const $body = $('#historyBody').empty();
      rows.forEach(function (r) {
        const $tr = $('<tr>');
        $tr.append($('<td>').text(new Date(r.createdAt).toLocaleString()));
        $tr.append($('<td>').text(r.principal));
        $tr.append($('<td>').text(r.rate));
        $tr.append($('<td>').text(r.months));
        $tr.append($('<td>').text(r.emi));
        $tr.append($('<td>').text(r.servedBy));
        $body.append($tr);
      });
    });
  }

  $('#emiForm').on('submit', function (e) {
    e.preventDefault();                         // stop the normal page reload (no postback)
    $('#errorBox').addClass('d-none');

    const principal = parseFloat($('#principal').val());
    const rate = parseFloat($('#rate').val());
    const months = parseInt($('#months').val(), 10);

    // client-side validation
    if (!(principal > 0) || !(rate > 0) || !(months > 0)) {
      return showError('Please enter positive numbers in all fields.');
    }

    $.ajax({
      url: '/api/emi',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ principal: principal, rate: rate, months: months }),
      success: function (res) {
        $('#emi').text(res.emi.toLocaleString());
        $('#total').text(res.totalPayment.toLocaleString());
        $('#interest').text(res.totalInterest.toLocaleString());
        $('#pod').text(res.servedBy);
        $('#podIp').text(res.podIp);
        $('#resultPanel').removeClass('d-none');
        loadHistory();                          // refresh only the history table
      },
      error: function (xhr) {
        showError((xhr.responseJSON && xhr.responseJSON.error) || 'Something went wrong.');
      }
    });
  });

  loadHistory();
</script>
</body>
</html>
