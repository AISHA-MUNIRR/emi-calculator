apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command: ["/bin/sh", "-c"]
          args:
            - |
              for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                until mongosh --host $h:27017 --quiet --eval "db.adminCommand('ping')"; do
                  echo "waiting for $h"; sleep 2
                done
              done
              mongosh --host mongo-0.mongo:27017 --quiet --eval '
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongo-0.mongo:27017" },
                    { _id: 1, host: "mongo-1.mongo:27017" },
                    { _id: 2, host: "mongo-2.mongo:27017" }
                  ]
                })'
